# Minimal restricted matcher policy for tenant supplied expressions.
#
# Enable it on an enforcer with:
#
#     from casbin import util
#     policy = util.RestrictionPolicy.from_enforcer(enforcer)
#     enforcer.set_restriction_policy(policy)
#
# When enabled, tenant matchers are limited to:
#   * grammar: boolean logic (and/or/not), comparisons, basic arithmetic,
#     ternary if/else and in/not-in; no lambdas, comprehensions, containers,
#     subscripts or attribute access;
#   * names:   only the flat request fields r_sub/r_obj/r_act and policy fields
#     p_sub/p_obj/p_act declared by this model;
#   * functions: only the side-effect free keyMatch, regexMatch and globMatch.
#
# Budgets per enforce call (shared across every candidate policy rule):
#   node_budget=200 evaluated expression nodes, call_budget=20 function calls.
# Exhausting either budget denies the request; budgets reset on every request.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# Tenant expressions may only combine the declared flat fields and the three
# allow-listed functions, for example:
#   r_sub == p_sub && r_act == p_act
#   keyMatch(r_obj, p_obj) && r_act == p_act
m = r_sub == p_sub && r_obj == p_obj && r_act == p_act
